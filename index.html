<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Park Tenerife La Gran Manzana</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <!-- Fitness Park logo -->
            <div class="logo-container">
                <img src="https://d1nwmbf35sn2fq.cloudfront.net/s3fs-public/2025-12/LOGO_FITNESS%20PARK_WHITE_2020_ES%20%281%29.svg" alt="Fitness Park Logo" class="logo">
            </div>
            <h1 class="title">
                GIMNASIO<br>
                TENERIFE - LA GRAN MANZANA
            </h1>
        </header>

        <main class="links">
            <a href="https://search.google.com/local/writereview?placeid=ChIJfRB7TjafagwRJTAnT1cAzoE" class="link-btn primary-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-star"></i>
                <span>DÉJANOS 5 ESTRELLAS EN GOOGLE</span>
            </a>
            
            <a href="https://www.instagram.com/fitnessparkgranmanzana/" class="link-btn secondary-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram"></i>
                <span>SÍGUENOS EN INSTAGRAM</span>
            </a>

            <a href="https://www.fitnesspark.es/club/tenerife-la-gran-manzana/" class="link-btn secondary-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-globe"></i>
                <span>VISITA NUESTRA WEB</span>
            </a>

            <a href="https://maps.app.goo.gl/MnFtH1AT82yC5Fkt5?g_st=ic" class="link-btn outline-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-location-dot"></i>
                <span>Cómo llegar</span>
            </a>
        </main>

        <div class="app-badges">
            <p class="app-badges-label">DESCARGA NUESTRA APP</p>
            <div class="app-badges-row">
                <a href="https://apps.apple.com/es/app/fitness-park-app/id1514794906?l=en-GB" target="_blank" rel="noopener noreferrer" class="badge-link">
                    <img src="https://developer.apple.com/app-store/marketing/guidelines/images/badge-download-on-the-app-store.svg" alt="Descargar en App Store" class="badge-img">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.fitnesspark.app.dromcom&hl=es&pli=1" target="_blank" rel="noopener noreferrer" class="badge-link">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Disponible en Google Play" class="badge-img">
                </a>
            </div>
        </div>
        
        <footer class="footer">
            <p>&copy; 2026 Fitness Park. Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
